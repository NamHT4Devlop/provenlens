<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>codelens</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --panel: #f6f7f9; --line: #dfe3e8; --ink: #1b1f24; --muted: #626b76;
    --accent: #2f6feb; --warn: #b25000; --ok: #1a7f47; --code-bg: #f6f8fa;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #161a20; --line: #262c35; --ink: #e6e9ee; --muted: #98a2b0;
      --accent: #6ea8ff; --warn: #e0954a; --ok: #4cc38a; --code-bg: #11151a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  header {
    position: sticky; top: 0; z-index: 5; display: flex; gap: 12px; align-items: center;
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  .brand { font-weight: 650; letter-spacing: -0.01em; }
  .brand span { color: var(--muted); font-weight: 400; margin-left: 8px; font-size: 12px; }
  #q {
    flex: 1; padding: 8px 12px; font: inherit; color: var(--ink);
    background: var(--bg); border: 1px solid var(--line); border-radius: 7px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .stats { color: var(--muted); font-size: 12px; white-space: nowrap; }
  main { display: grid; grid-template-columns: minmax(320px, 34%) 1fr; height: calc(100vh - 53px); }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; } #detail { display: none; } }
  #results, #detail { overflow: auto; }
  #results { border-right: 1px solid var(--line); }
  .row {
    padding: 9px 14px; border-bottom: 1px solid var(--line); cursor: pointer;
  }
  .row:hover { background: var(--panel); }
  .row[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 14%, transparent); }
  .row .n { font-family: var(--mono); font-size: 13px; }
  .row .f {
    color: var(--muted); font-size: 11.5px; font-family: var(--mono);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .n { display: flex; align-items: baseline; gap: 2px; }
  .row .n b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tag {
    display: inline-block; padding: 0 6px; margin-right: 6px; border-radius: 999px;
    font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
    background: var(--line); color: var(--muted);
  }
  .tag.test { background: color-mix(in srgb, var(--ok) 22%, transparent); color: var(--ok); }
  .tag.derived { background: color-mix(in srgb, var(--warn) 22%, transparent); color: var(--warn); }
  #detail { padding: 18px 22px 60px; }
  h2 {
    margin: 0 0 2px; font-size: 17px; font-family: var(--mono); font-weight: 620;
    /* A fully qualified name can be long; wrap it rather than clipping it. */
    overflow-wrap: anywhere; line-height: 1.35;
  }
  a.sym { overflow-wrap: anywhere; }
  .loc { color: var(--muted); font-size: 12px; font-family: var(--mono); margin-bottom: 16px;
         word-break: break-all; }
  h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
       margin: 22px 0 8px; }
  pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px;
    padding: 12px 14px; overflow: auto; font-family: var(--mono); font-size: 12.5px;
    line-height: 1.5; margin: 0;
  }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 5px 0; border-bottom: 1px solid var(--line); }
  a.sym {
    color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 12.5px;
    text-decoration: none;
  }
  a.sym:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 11.5px; }
  .conf { color: var(--warn); }
  .empty { color: var(--muted); padding: 26px 16px; }
  kbd {
    font-family: var(--mono); font-size: 11px; border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; color: var(--muted);
  }
</style>
</head>
<body>
<header>
  <div class="brand">codelens<span id="root"></span></div>
  <input id="q" placeholder="Search symbols — a name, Type#method, or a fragment" autocomplete="off" spellcheck="false">
  <div class="stats" id="stats"></div>
</header>
<main>
  <div id="results"><div class="empty">Type to search, or press <kbd>/</kbd> to focus.</div></div>
  <div id="detail"><div class="empty">Pick a symbol to see its source and how it connects.</div></div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

/** `a/b/c/d/e/File.java` -> `…/d/e/File.java`; the tail is what identifies it. */
function shortPath(path, keep = 3) {
  const parts = String(path ?? '').split('/');
  return parts.length <= keep ? path : '…/' + parts.slice(-keep).join('/');
}

let rows = [];
let cursor = -1;

async function api(path, params) {
  const url = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params ?? {})) url.searchParams.set(k, v);
  const res = await fetch(url);
  if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
  return res.json();
}

function tags(item) {
  let out = '<span class="tag">' + esc(item.kind) + '</span>';
  if (item.isTest) out += '<span class="tag test">test</span>';
  if (item.derived) out += '<span class="tag derived">derived</span>';
  return out;
}

function renderResults(items) {
  rows = items;
  cursor = -1;
  if (!items.length) {
    $('results').innerHTML = '<div class="empty">No symbol matches that.</div>';
    return;
  }
  $('results').innerHTML = items
    .map(
      (r, i) =>
        '<div class="row" data-i="' + i + '" role="option" title="' + esc(r.fqn) + '">' +
        '<div class="n">' + tags(r) + '<b>' + esc(r.name) + '</b></div>' +
        '<div class="f" title="' + esc(r.file) + '">' + esc(shortPath(r.file)) + ':' + r.line + '</div>' +
        '</div>',
    )
    .join('');
}

function relList(items, opts = {}) {
  if (!items.length) return '<div class="meta">None.</div>';
  return '<ul>' + items.map((c) => {
    const where = c.lines && c.lines.length ? c.lines.join(', ') : c.line;
    const conf = c.confidence != null && c.confidence < 1
      ? ' <span class="conf">' + esc(c.via) + ' · ' + c.confidence.toFixed(2) + '</span>'
      : '';
    const edge = opts.showEdge && c.edge && c.edge !== 'calls' ? ' <span class="tag">' + esc(c.edge) + '</span>' : '';
    return '<li><a class="sym" data-id="' + c.id + '">' + esc(c.fqn) + '</a>' + edge +
      '<div class="meta" title="' + esc(c.file) + '">' + esc(shortPath(c.file, 4)) + ':' + where +
      conf + '</div></li>';
  }).join('') + '</ul>';
}

async function openSymbol(id) {
  const d = await api('/api/symbol', { id });
  const parts = [];
  parts.push('<h2>' + tags(d) + esc(d.fqn) + '</h2>');
  parts.push('<div class="loc" title="' + esc(d.file) + '">' + esc(d.file) + ':' + d.startLine + '–' + d.endLine +
    (d.derived ? ' · derived, not written in this file' : '') + '</div>');

  if (d.source) parts.push('<pre>' + esc(d.source) + '</pre>');

  if (d.members.length) {
    parts.push('<h3>Members (' + d.members.length + ')</h3><ul>' + d.members.map((m) =>
      '<li><a class="sym" data-id="' + m.id + '">' + esc(m.name) + '</a>' +
      (m.derived ? ' <span class="tag derived">derived</span>' : '') +
      '<div class="meta">' + esc(m.signature ?? '') + '</div></li>').join('') + '</ul>');
  }
  if (d.related.length) {
    parts.push('<h3>Type relationships</h3>' + relList(d.related, { showEdge: true }));
  }
  parts.push('<h3>Callers (' + d.callers.length + ')</h3>' + relList(d.callers, { showEdge: true }));
  parts.push('<h3>Calls out to (' + d.callees.length + ')</h3>' + relList(d.callees, { showEdge: true }));
  if (d.wired.length) {
    parts.push('<h3>Wired by framework</h3>' + relList(d.wired, { showEdge: true }));
  }
  parts.push('<h3>Blast radius</h3><div class="meta">' + d.blast.symbols +
    ' symbol(s) across ' + d.blast.files + ' file(s) reach this.</div>');

  const pane = $('detail');
  pane.innerHTML = parts.join('');
  // Reset after layout: assigning scrollTop while the new content is still
  // being laid out leaves the pane wherever the previous symbol had it.
  pane.scrollTop = 0;
  requestAnimationFrame(() => { pane.scrollTop = 0; });
}

let timer;
$('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (!q) return renderResults([]);
  timer = setTimeout(async () => {
    try { renderResults(await api('/api/search', { q })); }
    catch (err) { $('results').innerHTML = '<div class="empty">' + esc(err.message) + '</div>'; }
  }, 110);
});

function select(i) {
  if (!rows.length) return;
  cursor = Math.max(0, Math.min(rows.length - 1, i));
  for (const el of document.querySelectorAll('.row')) {
    el.setAttribute('aria-selected', Number(el.dataset.i) === cursor);
  }
  const active = document.querySelector('.row[aria-selected="true"]');
  if (active) active.scrollIntoView({ block: 'nearest' });
  openSymbol(rows[cursor].id).catch(() => {});
}

document.addEventListener('click', (e) => {
  const row = e.target.closest('.row');
  if (row) return select(Number(row.dataset.i));
  const link = e.target.closest('a.sym');
  if (link) { e.preventDefault(); openSymbol(Number(link.dataset.id)).catch(() => {}); }
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); return; }
  if (e.key === 'ArrowDown') { e.preventDefault(); select(cursor + 1); }
  if (e.key === 'ArrowUp') { e.preventDefault(); select(cursor - 1); }
});

api('/api/overview').then((o) => {
  $('root').textContent = o.root.split('/').pop();
  $('stats').textContent =
    o.symbols.toLocaleString() + ' symbols · ' + o.edges.toLocaleString() + ' edges · ' +
    o.resolution + '% resolved';
  $('stats').title =
    o.calls.toLocaleString() + ' call sites: ' + o.linked.toLocaleString() + ' linked, ' +
    o.library.toLocaleString() + ' into libraries, ' + o.missed.toLocaleString() + ' unresolved';
}).catch(() => {});

$('q').focus();
</script>
</body>
</html>
