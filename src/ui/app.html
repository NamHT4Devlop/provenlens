<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>provenlens</title>
<style>
  /*
   * Palettes come from the editor themes people have read code in for years.
   * Solarized was designed around reduced eye strain rather than contrast,
   * which is why it is the default here: a pure black canvas is punishing to
   * look at for any length of time.
   */
  :root {
    --bg: #002b36; --panel: #073642; --line: #0d4a5a; --ink: #93a1a1;
    --ink-strong: #eee8d5; --muted: #657b83; --accent: #268bd2; --warn: #cb4b16;
    --seed: #6c71c4; --cross: #2aa198;
    --class: #d33682; --method: #dc322f; --fn: #cb4b16; --field: #6c71c4;
    --file: #268bd2; --sql: #2aa198; --route: #b58900;
    --code-bg: #012b36;
    --edge: rgba(147,161,161,.5); --edge-dim: rgba(147,161,161,.15);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    --ui-font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --panel-w: 520px;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); overflow: hidden;
    font: 13px/1.5 var(--ui-font);
  }
  header {
    position: absolute; inset: 0 auto auto 0; width: 100%; z-index: 3;
    display: flex; gap: 10px; align-items: center; padding: 10px 14px;
    background: linear-gradient(var(--bg), color-mix(in srgb, var(--bg) 70%, transparent));
  }
  .brand { font-weight: 650; letter-spacing: -.01em; white-space: nowrap; color: var(--ink-strong); }
  .brand span { color: var(--muted); font-weight: 400; font-size: 11.5px; margin-left: 7px; }
  .search { position: relative; flex: 0 1 380px; }
  #q {
    width: 100%; padding: 8px 12px; font: inherit; color: var(--ink-strong);
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
  }
  #q:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #suggest {
    position: absolute; top: 40px; left: 0; right: 0; max-height: 340px; overflow: auto;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; display: none;
  }
  #suggest.on { display: block; }
  .sg { padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .sg:hover, .sg[aria-selected="true"] { background: color-mix(in srgb, var(--accent) 22%, transparent); }
  .sg b { font-family: var(--mono); font-weight: 600; font-size: 13px; color: var(--ink-strong); }
  .sg i { display: block; color: var(--muted); font-style: normal; font-size: 11.5px; font-family: var(--mono); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--line); border-radius: 999px;
    font-size: 11.5px; color: var(--muted); user-select: none; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { color: var(--ink-strong); border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
  .chip .dot { width: 9px; height: 9px; border-radius: 50%; }
  .spacer { flex: 1; }
  .hint { color: var(--muted); font-size: 11.5px; white-space: nowrap; }
  #theme, #repos {
    padding: 5px 8px; font: inherit; font-size: 11.5px; color: var(--muted);
    background: var(--panel); border: 1px solid var(--line); border-radius: 7px; cursor: pointer;
  }
  /* Scoped to one repository, the picker wears that repository's hue, which is
     the same hue its nodes are ringed with on the canvas. */
  #repos[data-scoped="true"] { color: var(--ink-strong); border-color: currentColor; }
  #stage { position: absolute; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .overlay {
    position: absolute; z-index: 2; background: color-mix(in srgb, var(--panel) 92%, transparent);
    border: 1px solid var(--line); border-radius: 8px; backdrop-filter: blur(6px);
  }
  #counts { left: 14px; bottom: 14px; padding: 7px 11px; color: var(--muted); font-size: 11.5px; }
  #counts b { color: var(--ink-strong); font-weight: 600; }
  #tools { right: 14px; bottom: 14px; display: flex; gap: 2px; padding: 4px; }
  #tools button {
    width: 30px; height: 28px; display: grid; place-items: center; cursor: pointer;
    background: transparent; border: 0; color: var(--muted); border-radius: 6px; font-size: 14px;
  }
  #tools button:hover { background: var(--line); color: var(--ink-strong); }

  #panel {
    position: absolute; top: 92px; right: 14px; bottom: 56px; width: var(--panel-w);
    z-index: 2; padding: 18px 22px; overflow: auto; display: none;
  }
  #panel.on { display: block; }
  /*
   * Dragging this edge widens the panel; source is the thing being read.
   * Wide enough to hit on a high-density display, and visible without hovering
   * first -- an invisible ten-pixel strip is a control nobody finds.
   */
  #grip {
    position: absolute; top: 92px; bottom: 56px; z-index: 3; width: 18px;
    right: calc(var(--panel-w) + 10px); cursor: col-resize; display: none;
  }
  #grip.on { display: block; }
  #grip::after {
    content: ''; position: absolute; top: 50%; left: 6px; width: 6px; height: 54px;
    transform: translateY(-50%); border-radius: 3px; background: var(--line);
    opacity: .85; transition: opacity .15s, background .15s;
  }
  #grip:hover::after, #grip.dragging::after { opacity: 1; background: var(--accent); }
  @media (max-width: 700px) { #panel { left: 14px; width: auto; top: 120px; } #grip { display: none; } }

  #panel h2 {
    margin: 0 0 4px; font-size: 17px; font-family: var(--mono); font-weight: 620;
    overflow-wrap: anywhere; line-height: 1.35; color: var(--ink-strong);
  }
  #panel .loc { color: var(--muted); font-size: 12.5px; font-family: var(--mono);
                word-break: break-all; margin-bottom: 14px; }
  #panel h3 { font-size: 11.5px; text-transform: uppercase; letter-spacing: .06em;
              color: var(--muted); margin: 20px 0 8px; }
  #panel pre {
    background: var(--code-bg); border: 1px solid var(--line); border-radius: 7px;
    padding: 12px 14px; overflow: auto; font-family: var(--mono); font-size: 13.5px;
    line-height: 1.62; margin: 0; max-height: 46vh; color: var(--ink);
  }
  #panel ul { list-style: none; margin: 0; padding: 0; }
  #panel li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  a.sym { color: var(--accent); cursor: pointer; font-family: var(--mono); font-size: 13px;
          overflow-wrap: anywhere; }
  a.sym:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; }
  .conf { color: var(--warn); }
  .tag { display: inline-block; padding: 0 6px; margin-right: 5px; border-radius: 999px;
         font-size: 10.5px; text-transform: uppercase; letter-spacing: .04em;
         background: var(--line); color: var(--muted); }
  .close { float: right; cursor: pointer; color: var(--muted); font-size: 20px; line-height: 1; }
  .close:hover { color: var(--ink-strong); }
  #empty { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted);
           text-align: center; pointer-events: none; padding: 0 24px; }
  kbd { font-family: var(--mono); font-size: 11px; border: 1px solid var(--line);
        border-bottom-width: 2px; border-radius: 4px; padding: 1px 5px; }
</style>
</head>
<body>
<div id="stage"><canvas id="cv"></canvas></div>
<div id="empty">Loading the workspace…</div>

<header>
  <div class="brand">provenlens<span id="root"></span></div>
  <div class="search">
    <input id="q" placeholder="Search nodes — or trace a chain with A -> B" autocomplete="off" spellcheck="false">
    <div id="suggest"></div>
  </div>
  <select id="repos" title="Repository to show"></select>
  <div class="filters" id="filters"></div>
  <div class="spacer"></div>
  <select id="theme" title="Colour scheme"></select>
  <div class="hint" id="stats"></div>
</header>
<div id="grip" title="Drag to resize"></div>

<div class="overlay" id="counts"><b id="nNodes">0</b> nodes &nbsp; <b id="nEdges">0</b> edges</div>
<div class="overlay" id="tools">
  <button id="zoomOut" title="Zoom out">−</button>
  <button id="fit" title="Fit to view">⤢</button>
  <button id="zoomIn" title="Zoom in">+</button>
  <button id="png" title="Save as PNG">⇩</button>
</div>
<div class="overlay" id="panel"></div>

<script>
/**
 * Editor palettes, kept as data so the canvas and the page cannot drift apart:
 * everything drawn reads these same variables.
 *
 * Solarized leads because it was designed around reduced eye strain rather
 * than maximum contrast, which is the complaint a pure black canvas earns.
 * Matrix breaks that rule on purpose -- it is the look, not a default -- so it
 * also carries its own font and repo hues to keep the whole page in palette.
 */
const THEMES = {
  'solarized-dark': {
    label: 'Solarized Dark',
    vars: {
      bg: '#002b36', panel: '#073642', line: '#0d4a5a', ink: '#93a1a1',
      'ink-strong': '#eee8d5', muted: '#657b83', accent: '#268bd2', warn: '#cb4b16',
      seed: '#6c71c4', cross: '#2aa198', class: '#d33682', method: '#dc322f',
      fn: '#cb4b16', field: '#6c71c4', file: '#268bd2', sql: '#2aa198', route: '#b58900',
      'code-bg': '#012b36', edge: 'rgba(147,161,161,.5)', 'edge-dim': 'rgba(147,161,161,.15)',
    },
  },
  'solarized-light': {
    label: 'Solarized Light',
    vars: {
      bg: '#fdf6e3', panel: '#eee8d5', line: '#ded8c5', ink: '#586e75',
      'ink-strong': '#073642', muted: '#93a1a1', accent: '#268bd2', warn: '#cb4b16',
      seed: '#6c71c4', cross: '#2aa198', class: '#d33682', method: '#dc322f',
      fn: '#cb4b16', field: '#6c71c4', file: '#268bd2', sql: '#2aa198', route: '#b58900',
      'code-bg': '#f7f0dd', edge: 'rgba(88,110,117,.5)', 'edge-dim': 'rgba(88,110,117,.15)',
    },
  },
  gruvbox: {
    label: 'Gruvbox Dark',
    vars: {
      bg: '#282828', panel: '#32302f', line: '#504945', ink: '#d5c4a1',
      'ink-strong': '#fbf1c7', muted: '#a89984', accent: '#83a598', warn: '#fe8019',
      seed: '#d3869b', cross: '#8ec07c', class: '#fabd2f', method: '#fb4934',
      fn: '#fe8019', field: '#d3869b', file: '#83a598', sql: '#8ec07c', route: '#fabd2f',
      'code-bg': '#1d2021', edge: 'rgba(213,196,161,.45)', 'edge-dim': 'rgba(213,196,161,.14)',
    },
  },
  monokai: {
    label: 'Monokai',
    vars: {
      bg: '#272822', panel: '#3e3d32', line: '#49483e', ink: '#cfcfc2',
      'ink-strong': '#f8f8f2', muted: '#8f908a', accent: '#66d9ef', warn: '#fd971f',
      seed: '#ae81ff', cross: '#a6e22e', class: '#f92672', method: '#fd971f',
      fn: '#e6db74', field: '#ae81ff', file: '#66d9ef', sql: '#a6e22e', route: '#e6db74',
      'code-bg': '#1e1f1c', edge: 'rgba(207,207,194,.45)', 'edge-dim': 'rgba(207,207,194,.14)',
    },
  },
  nord: {
    label: 'Nord',
    vars: {
      bg: '#2e3440', panel: '#3b4252', line: '#4c566a', ink: '#d8dee9',
      'ink-strong': '#eceff4', muted: '#7b88a1', accent: '#88c0d0', warn: '#d08770',
      seed: '#b48ead', cross: '#a3be8c', class: '#81a1c1', method: '#bf616a',
      fn: '#d08770', field: '#b48ead', file: '#88c0d0', sql: '#a3be8c', route: '#ebcb8b',
      'code-bg': '#292e39', edge: 'rgba(216,222,233,.45)', 'edge-dim': 'rgba(216,222,233,.14)',
    },
  },
  matrix: {
    label: 'Matrix',
    glow: true,
    font: 'ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace',
    vars: {
      bg: '#000000', panel: '#020a04', line: '#0d3b18', ink: '#00c740',
      'ink-strong': '#adffc0', muted: '#1d7a33', accent: '#39ff70', warn: '#b6ff00',
      seed: '#d6ffe0', cross: '#00ffa3', class: '#00ff41', method: '#00d437',
      fn: '#5cff87', field: '#0aa62f', file: '#7dffa0', sql: '#00ffa3', route: '#b6ff00',
      'code-bg': '#000000', edge: 'rgba(0,255,65,.38)', 'edge-dim': 'rgba(0,255,65,.12)',
    },
    repoColors: ['#00ff41', '#00ffa3', '#b6ff00', '#5cff87', '#00c740', '#adffc0', '#0aa62f'],
  },
  'one-dark': {
    label: 'One Dark',
    vars: {
      bg: '#282c34', panel: '#21252b', line: '#3e4451', ink: '#abb2bf',
      'ink-strong': '#dcdfe4', muted: '#7f848e', accent: '#61afef', warn: '#d19a66',
      seed: '#c678dd', cross: '#56b6c2', class: '#e5c07b', method: '#e06c75',
      fn: '#d19a66', field: '#c678dd', file: '#61afef', sql: '#56b6c2', route: '#e5c07b',
      'code-bg': '#21252b', edge: 'rgba(171,178,191,.45)', 'edge-dim': 'rgba(171,178,191,.14)',
    },
  },
};

// Held so the canvas can ask about more than colour -- whether to glow, for one.
let theme = THEMES['solarized-dark'];

function applyTheme(name) {
  theme = THEMES[name] ?? THEMES['solarized-dark'];
  for (const [key, value] of Object.entries(theme.vars)) {
    document.documentElement.style.setProperty('--' + key, value);
  }
  // A theme may set the interface font too; the rest fall back to the default.
  document.documentElement.style.setProperty(
    '--ui-font',
    theme.font ?? '-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif',
  );
  try { localStorage.setItem('provenlens.theme', name); } catch { /* private mode */ }
  // Swatches and the canvas hold colours of their own; CSS variables miss them.
  renderFilters();
  renderRepos();
  draw();
}

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const shortPath = (p, keep = 3) => {
  const parts = String(p ?? '').split('/');
  return parts.length <= keep ? p : '…/' + parts.slice(-keep).join('/');
};

const COLORS = {
  class: '--class', interface: '--class', enum: '--class', record: '--class', module: '--class',
  method: '--method', constructor: '--method', class_method: '--method',
  function: '--fn', field: '--field', file: '--file',
  'sql-statement': '--sql', 'camel-route': '--route', migration: '--route',
};
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const colorOf = (kind) => css(COLORS[kind] ?? '--muted');

// One hue per repository, used as a ring so it never fights the kind colour.
const REPO_COLORS = ['#7aa2ff', '#2dd4bf', '#fbbf24', '#f472b6', '#a78bfa', '#4ade80', '#fb923c'];
let repos = [];
let activeRepo = null; // null = every repository

const repoColor = (id) => {
  const palette = theme.repoColors ?? REPO_COLORS;
  return palette[id % palette.length];
};
const repoName = (id) => repos.find((r) => r.id === id)?.name ?? '';

const KINDS = [
  ['class', 'Types', ['class', 'interface', 'enum', 'record', 'module']],
  ['method', 'Methods', ['method', 'constructor', 'class_method']],
  ['function', 'Functions', ['function']],
  ['field', 'Fields', ['field']],
  ['file', 'Files', ['file']],
  ['derived', 'Derived', ['sql-statement', 'camel-route', 'migration']],
];
const enabled = new Set(KINDS.map((k) => k[0]));
const groupOf = (kind) => (KINDS.find((k) => k[2].includes(kind)) ?? ['field'])[0];

let nodes = [];
let edges = [];
let byId = new Map();
let selected = null;
let hover = null;
let view = { x: 0, y: 0, k: 1 };
let dragNode = null;
let panning = null;

const cv = $('cv');
const ctx = cv.getContext('2d');

function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = r.width * dpr;
  cv.height = r.height * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
new ResizeObserver(resize).observe(cv);
resize();

/*
 * The token arrives once, in the URL the server printed, and is kept here so
 * the bare address works from then on -- a bookmark, a reload, a link out of
 * history. localStorage rather than a cookie on purpose: cookies ignore the
 * port, so one set for 127.0.0.1 would be handed to every other dev server
 * running on this machine. Storage is scoped to the port as well as the host.
 *
 * It travels as a header, so it stays out of anything that logs URLs.
 */
const TOKEN_KEY = 'provenlens.token';
let TOKEN = '';
try { TOKEN = localStorage.getItem(TOKEN_KEY) ?? ''; } catch { /* private mode */ }

const tokenInUrl = new URLSearchParams(location.search).get('token');
if (tokenInUrl) {
  TOKEN = tokenInUrl;
  try { localStorage.setItem(TOKEN_KEY, tokenInUrl); } catch { /* private mode */ }
  // The address bar has done its job once the page holds the token; leaving it
  // there only invites it into history and screenshots.
  history.replaceState(null, '', location.pathname);
}

async function api(path, params) {
  const url = new URL(path, location.origin);
  for (const [k, v] of Object.entries(params ?? {})) url.searchParams.set(k, v);
  const res = await fetch(url, { headers: { 'x-provenlens-token': TOKEN } });
  if (res.status === 403) { needsToken(); throw new Error('needs token'); }
  if (!res.ok) throw new Error((await res.json()).error ?? res.statusText);
  return res.json();
}

/**
 * Two ways to arrive without a usable token: a first visit to the bare address,
 * or a stored one that a `serve --new-token` has since retired. Both land here.
 * Saying so beats an empty canvas, which reads as a workspace with no code in
 * it rather than as a page that was refused.
 */
let tokenAsked = false;
function needsToken() {
  if (tokenAsked) return;
  tokenAsked = true;
  try { localStorage.removeItem(TOKEN_KEY); } catch { /* private mode */ }
  $('empty').innerHTML =
    '<div><b>provenlens needs the token it printed at startup.</b><br>' +
    'Open the <code>?token=…</code> URL from your terminal once — it is saved for ' +
    esc(location.origin) + ', so after that this address alone is enough.</div>';
  $('empty').style.display = 'grid';
}

// ---- layout: a small force simulation, enough for a few hundred nodes -------
let alpha = 0;
function kick(v = 1) { alpha = v; }

/**
 * One iteration of the physics. Split out so it can be run without drawing.
 * `cool` is the decay: the settling pass uses a slower one so more of the work
 * happens while repulsion is still strong enough to separate the nodes.
 */
function tick(cool = 0.985, movable = null) {
  alpha *= cool;
  const visible = nodes.filter((n) => n.shown);
  const cx = cv.clientWidth / 2;
  const cy = cv.clientHeight / 2;

  for (const a of visible) {
    a.vx = (a.vx ?? 0) * 0.86;
    a.vy = (a.vy ?? 0) * 0.86;
    // Pull gently to the middle so the graph cannot drift off screen.
    a.vx += (cx - a.x) * 0.0016 * alpha;
    a.vy += (cy - a.y) * 0.0016 * alpha;
  }
  for (let i = 0; i < visible.length; i++) {
    for (let j = i + 1; j < visible.length; j++) {
      const a = visible[i], b = visible[j];
      let dx = b.x - a.x, dy = b.y - a.y;
      let d2 = dx * dx + dy * dy;
      if (d2 < 1) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 1; }
      if (d2 > 490000) continue;
      const f = (46000 * alpha) / d2;
      const d = Math.sqrt(d2);
      a.vx -= (dx / d) * f; a.vy -= (dy / d) * f;
      b.vx += (dx / d) * f; b.vy += (dy / d) * f;
    }
  }
  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (!a?.shown || !b?.shown) continue;
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = Math.hypot(dx, dy) || 1;
    const f = ((d - 175) * 0.012 * alpha);
    a.vx += (dx / d) * f; a.vy += (dy / d) * f;
    b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
  }
  for (const n of visible) {
    if (n === dragNode) continue;
    // During an expansion only the new nodes move, so the picture the reader
    // was already looking at stays where they left it.
    if (movable && !movable.has(n.id)) continue;
    n.x += n.vx; n.y += n.vy;
  }
}

/**
 * Runs the layout to rest before anything is drawn.
 *
 * Leaving it to the animation loop means a graph opened in a background tab
 * never settles: Chrome throttles requestAnimationFrame to a few frames a
 * minute there, so the picture would be frozen mid-spread on return.
 */
function settle(iterations = 600, movable = null) {
  alpha = 1;
  for (let i = 0; i < iterations && alpha > 0.002; i++) tick(0.992, movable);
  alpha = 0.02;
}

function step() {
  if (alpha > 0.002) tick();
  draw();
  requestAnimationFrame(step);
}

const radiusOf = (n) => (n.isRepo ? 22 : n.seed ? 17 : n.kind === 'file' ? 13 : 11);
const toScreen = (n) => ({ x: n.x * view.k + view.x, y: n.y * view.k + view.y });

function draw() {
  ctx.clearRect(0, 0, cv.clientWidth, cv.clientHeight);
  // Zoomed out, labelling everything is noise. Zoomed in, it is the point.
  // In between, label only what the reader is looking at.
  const allLabels = view.k > 0.55;
  const showEdgeLabels = view.k > 0.72;

  for (const e of edges) {
    const a = byId.get(e.from), b = byId.get(e.to);
    if (!a?.shown || !b?.shown) continue;
    const p = toScreen(a), q = toScreen(b);
    const dim = selected && e.from !== selected.id && e.to !== selected.id;

    // An edge that leaves the repository is the whole point of opening several,
    // so it is drawn to stand out rather than blend in.
    ctx.strokeStyle = e.crossRepo
      ? (dim ? css('--edge-dim') : css('--cross'))
      : dim ? css('--edge-dim') : css('--edge');
    ctx.lineWidth = e.crossRepo ? 2 : e.confidence != null && e.confidence < 1 ? 1 : 1.4;
    if (e.crossRepo) ctx.setLineDash([7, 4]);
    else if (e.confidence != null && e.confidence < 1) ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke();
    ctx.setLineDash([]);

    // arrow head, stopped at the node edge
    const ang = Math.atan2(q.y - p.y, q.x - p.x);
    const r = radiusOf(b) * view.k + 3;
    const hx = q.x - Math.cos(ang) * r, hy = q.y - Math.sin(ang) * r;
    ctx.fillStyle = dim ? css('--edge-dim') : css('--edge');
    ctx.beginPath();
    ctx.moveTo(hx, hy);
    ctx.lineTo(hx - Math.cos(ang - 0.4) * 8, hy - Math.sin(ang - 0.4) * 8);
    ctx.lineTo(hx - Math.cos(ang + 0.4) * 8, hy - Math.sin(ang + 0.4) * 8);
    ctx.fill();

    // Cross-repo edges carry a label (the queue name); ordinary edges only
    // have a kind, and a plain call needs no caption at all.
    const caption = e.label ?? (e.kind && e.kind !== 'calls' ? e.kind : null);
    if (showEdgeLabels && !dim && caption) {
      const mx = (p.x + q.x) / 2, my = (p.y + q.y) / 2;
      ctx.save();
      ctx.translate(mx, my);
      let a2 = ang;
      if (a2 > Math.PI / 2 || a2 < -Math.PI / 2) a2 += Math.PI;
      ctx.rotate(a2);
      ctx.font = '9px ui-monospace, monospace';
      ctx.fillStyle = e.crossRepo ? css('--cross') : css('--muted');
      ctx.textAlign = 'center';
      ctx.fillText(caption.toUpperCase(), 0, -4);
      ctx.restore();
    }
  }

  for (const n of nodes) {
    if (!n.shown) continue;
    const p = toScreen(n);
    const r = radiusOf(n) * view.k;
    const dim = selected && selected.id !== n.id && !n.adjacent;

    ctx.globalAlpha = dim ? 0.35 : 1;
    ctx.beginPath();
    if (n.isRepo) {
      // A repository is not a symbol, so it is not drawn as one.
      ctx.roundRect(p.x - r, p.y - r * 0.72, r * 2, r * 1.44, 6 * view.k);
    } else {
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
    }
    const fill = n.isRepo ? repoColor(n.repo) : n.seed ? css('--seed') : colorOf(n.kind);
    if (theme.glow && !dim) {
      ctx.shadowColor = fill;
      ctx.shadowBlur = 14;
    }
    ctx.fillStyle = fill;
    ctx.fill();
    ctx.shadowBlur = 0;
    // Selection is drawn on the node itself; the repository ring sits outside
    // it, so picking a node never hides which repository it came from.
    if (n === hover || selected?.id === n.id) {
      ctx.lineWidth = 2.5; ctx.strokeStyle = css('--ink-strong'); ctx.stroke();
    }
    if (repos.length > 1 && !n.isRepo) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, r + 3.5, 0, Math.PI * 2);
      ctx.lineWidth = 2.5;
      ctx.strokeStyle = repoColor(n.repo);
      ctx.stroke();
    }
    if (n.isTest) {
      ctx.lineWidth = 2; ctx.strokeStyle = css('--cross');
      ctx.setLineDash([3, 3]); ctx.stroke(); ctx.setLineDash([]);
    }

    const label = n.isRepo || allLabels || n.seed || n === hover || selected?.id === n.id || n.adjacent;
    if (label) {
      ctx.font = (n.isRepo || n.seed ? '600 ' : '') +
        Math.max(10, (n.isRepo ? 13 : 11) * view.k) + 'px ui-monospace, monospace';
      const labelColor = dim ? css('--muted') : css('--ink-strong');
      if (theme.glow && !dim) {
        ctx.shadowColor = labelColor;
        ctx.shadowBlur = 8;
      }
      ctx.fillStyle = labelColor;
      ctx.textAlign = 'center';
      ctx.fillText(n.name.length > 26 ? n.name.slice(0, 25) + '…' : n.name, p.x, p.y + r + 13);
      ctx.shadowBlur = 0;
    }
    ctx.globalAlpha = 1;
  }
}

function markAdjacent() {
  for (const n of nodes) n.adjacent = false;
  if (!selected) return;
  for (const e of edges) {
    if (e.from === selected.id) { const t = byId.get(e.to); if (t) t.adjacent = true; }
    if (e.to === selected.id) { const t = byId.get(e.from); if (t) t.adjacent = true; }
  }
}

function applyFilters() {
  for (const n of nodes) n.shown = n.seed || enabled.has(groupOf(n.kind));
  $('nNodes').textContent = nodes.filter((n) => n.shown).length;
  $('nEdges').textContent = edges.filter((e) => byId.get(e.from)?.shown && byId.get(e.to)?.shown).length;
  $('empty').style.display = nodes.some((n) => n.shown) ? 'none' : 'grid';
}

function mergeGraph(g, seedAt, { pinExisting = false } = {}) {
  const fresh = new Set();
  for (const n of g.nodes) {
    if (byId.has(n.id)) { if (n.seed) byId.get(n.id).seed = true; continue; }
    fresh.add(n.id);
    const angle = Math.random() * Math.PI * 2;
    const spread = 90 + Math.random() * 130;
    const node = {
      ...n,
      x: (seedAt?.x ?? cv.clientWidth / 2) + Math.cos(angle) * spread,
      y: (seedAt?.y ?? cv.clientHeight / 2) + Math.sin(angle) * spread,
      vx: 0, vy: 0,
    };
    nodes.push(node);
    byId.set(n.id, node);
  }
  const seen = new Set(edges.map((e) => e.from + '|' + e.to + '|' + e.kind));
  for (const e of g.edges) {
    const key = e.from + '|' + e.to + '|' + e.kind;
    if (!seen.has(key)) { edges.push(e); seen.add(key); }
  }
  applyFilters();
  markAdjacent();
  settle(pinExisting ? 320 : 600, pinExisting ? fresh : null);
}

/**
 * What the page shows before anything is asked of it: each repository, the
 * types most depended upon inside it, and any binding that crosses between
 * them. An empty canvas answers nothing about a codebase you have not seen.
 */
async function loadLanding() {
  nodes = []; edges = []; byId = new Map(); selected = null;
  $('panel').classList.remove('on');
  $('grip').classList.remove('on');
  const g = await api('/api/landing', { limit: 10, repo: activeRepo ?? 'all' });
  mergeGraph(g);
  fit();
}

async function focusSymbol(id, { reset = false } = {}) {
  if (reset) { nodes = []; edges = []; byId = new Map(); }
  const at = byId.get(id);
  const g = await api('/api/graph', { ids: id, depth: 1 });
  // Growing from a node already on screen should add to the picture, not
  // rearrange it.
  mergeGraph(g, at, { pinExisting: !reset && Boolean(at) });
  selected = byId.get(id) ?? null;
  if (selected) selected.seed = true;
  markAdjacent();
  if (reset) fit();
  await showPanel(id);
}

// ---- detail panel -----------------------------------------------------------
function relList(items) {
  if (!items.length) return '<div class="meta">None.</div>';
  return '<ul>' + items.map((c) => {
    const where = c.lines && c.lines.length ? c.lines.join(', ') : c.line;
    const conf = c.confidence != null && c.confidence < 1
      ? ' <span class="conf">' + esc(c.via) + ' · ' + c.confidence.toFixed(2) + '</span>' : '';
    const edge = c.edge && c.edge !== 'calls' ? '<span class="tag">' + esc(c.edge) + '</span>' : '';
    const from = repos.length > 1 && c.repoName
      ? '<span style="color:' + repoColor(c.repo) + '">' + esc(c.repoName) + '</span> · ' : '';
    return '<li>' + edge + '<a class="sym" data-id="' + c.id + '">' + esc(c.fqn) + '</a>' +
      '<div class="meta" title="' + esc(c.file) + '">' + from + esc(shortPath(c.file, 4)) + ':' +
      where + conf + '</div></li>';
  }).join('') + '</ul>';
}

async function showPanel(id) {
  const d = await api('/api/symbol', { id });
  const p = [];
  p.push('<span class="close" id="closePanel">×</span>');
  p.push('<h2><span class="tag">' + esc(d.kind) + '</span>' + esc(d.fqn) + '</h2>');
  p.push('<div class="loc" title="' + esc(d.file) + '">' +
    (repos.length > 1 ? '<span style="color:' + repoColor(d.repo) + '">' + esc(d.repoName) + '</span> · ' : '') +
    esc(d.file) + ':' + d.startLine + '–' + d.endLine + (d.derived ? ' · derived' : '') + '</div>');
  if (d.source) p.push('<pre>' + esc(d.source) + '</pre>');
  if (d.members.length) {
    p.push('<h3>Members (' + d.members.length + ')</h3><ul>' + d.members.map((m) =>
      '<li><a class="sym" data-id="' + m.id + '">' + esc(m.name) + '</a>' +
      '<div class="meta">' + esc(m.signature ?? '') + '</div></li>').join('') + '</ul>');
  }
  if (d.related.length) p.push('<h3>Type relationships</h3>' + relList(d.related));
  p.push('<h3>Callers (' + d.callers.length + ')</h3>' + relList(d.callers));
  p.push('<h3>Calls out to (' + d.callees.length + ')</h3>' + relList(d.callees));
  if (d.wired.length) p.push('<h3>Wired by framework</h3>' + relList(d.wired));
  if (d.crossRepo?.length) {
    p.push('<h3>Across repositories (' + d.crossRepo.length + ')</h3>' + relList(d.crossRepo));
  }
  p.push('<h3>Blast radius</h3><div class="meta">' + d.blast.symbols + ' symbol(s) across ' +
    d.blast.files + ' file(s) reach this.</div>');

  const pane = $('panel');
  pane.innerHTML = p.join('');
  pane.classList.add('on');
  $('grip').classList.add('on');
  pane.scrollTop = 0;
  requestAnimationFrame(() => { pane.scrollTop = 0; });
}

// ---- interaction ------------------------------------------------------------
function nodeAt(sx, sy) {
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (!n.shown) continue;
    const p = toScreen(n);
    const r = radiusOf(n) * view.k;
    if (n.isRepo) {
      if (Math.abs(p.x - sx) <= r + 3 && Math.abs(p.y - sy) <= r * 0.72 + 3) return n;
      continue;
    }
    if (Math.hypot(p.x - sx, p.y - sy) <= r + 4) return n;
  }
  return null;
}

cv.addEventListener('mousedown', (e) => {
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n) { dragNode = n; }
  else { panning = { x: e.offsetX - view.x, y: e.offsetY - view.y }; cv.classList.add('dragging'); }
});
cv.addEventListener('mousemove', (e) => {
  if (dragNode) {
    dragNode.x = (e.offsetX - view.x) / view.k;
    dragNode.y = (e.offsetY - view.y) / view.k;
    dragNode.vx = dragNode.vy = 0;
    kick(0.35);
    return;
  }
  if (panning) { view.x = e.offsetX - panning.x; view.y = e.offsetY - panning.y; return; }
  const n = nodeAt(e.offsetX, e.offsetY);
  if (n !== hover) { hover = n; cv.title = n ? n.fqn + '\n' + n.file + ':' + n.line : ''; }
});
window.addEventListener('mouseup', () => { dragNode = null; panning = null; cv.classList.remove('dragging'); });

cv.addEventListener('click', (e) => {
  const n = nodeAt(e.offsetX, e.offsetY);
  if (!n) return;
  if (n.isRepo) {
    activeRepo = n.repo;
    renderRepos();
    loadLanding().catch(() => {});
    return;
  }
  selected = n;
  markAdjacent();
  focusSymbol(n.id).catch(() => {});
});

cv.addEventListener('wheel', (e) => {
  e.preventDefault();
  const factor = Math.exp(-e.deltaY * 0.0015);
  const k = Math.min(3, Math.max(0.15, view.k * factor));
  view.x = e.offsetX - ((e.offsetX - view.x) * k) / view.k;
  view.y = e.offsetY - ((e.offsetY - view.y) * k) / view.k;
  view.k = k;
}, { passive: false });

function fit() {
  const vis = nodes.filter((n) => n.shown);
  if (!vis.length) return;
  const xs = vis.map((n) => n.x), ys = vis.map((n) => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 90;
  const k = Math.min(
    (cv.clientWidth - pad * 2) / Math.max(maxX - minX, 1),
    (cv.clientHeight - pad * 2) / Math.max(maxY - minY, 1),
    1.6,
  );
  view.k = Math.max(0.12, k);
  view.x = cv.clientWidth / 2 - ((minX + maxX) / 2) * view.k;
  view.y = cv.clientHeight / 2 - ((minY + maxY) / 2) * view.k;
}

$('zoomIn').onclick = () => { view.k = Math.min(3, view.k * 1.3); };
$('zoomOut').onclick = () => { view.k = Math.max(0.15, view.k / 1.3); };
$('fit').onclick = fit;
$('png').onclick = () => {
  const a = document.createElement('a');
  a.download = 'provenlens-graph.png';
  a.href = cv.toDataURL('image/png');
  a.click();
};

document.addEventListener('click', (e) => {
  if (e.target.id === 'closePanel') {
    $('panel').classList.remove('on');
    $('grip').classList.remove('on');
    return;
  }
  const link = e.target.closest('a.sym');
  if (link) { e.preventDefault(); focusSymbol(link.dataset.id).catch(() => {}); }
});

// ---- search -----------------------------------------------------------------
let hits = [];
let cursor = -1;
let timer;

$('q').addEventListener('input', (e) => {
  clearTimeout(timer);
  const q = e.target.value.trim();
  if (!q) { $('suggest').classList.remove('on'); return; }

  // "A -> B" asks for the chain between two symbols instead of a search.
  const arrow = q.split('->');
  if (arrow.length === 2 && arrow[0].trim() && arrow[1].trim()) {
    timer = setTimeout(async () => {
      try {
        const g = await api('/api/path', {
          from: arrow[0].trim(), to: arrow[1].trim(), repo: activeRepo ?? 'all',
        });
        $('suggest').innerHTML = g.found
          ? '<div class="sg"><i>' + g.length + ' hop(s) — drawn on the canvas</i></div>'
          : '<div class="sg"><i>No directed path between those two.</i></div>';
        $('suggest').classList.add('on');
        if (g.found) {
          nodes = []; edges = []; byId = new Map(); selected = null;
          $('panel').classList.remove('on');
          mergeGraph(g);
          // The chain is the answer, so every link on it deserves its name.
          for (const n of nodes) n.seed = true;
          fit();
        }
      } catch { /* one bad half of the query is not an error worth showing */ }
    }, 250);
    return;
  }
  timer = setTimeout(async () => {
    hits = await api('/api/search', { q, limit: 20, repo: activeRepo ?? 'all' });
    cursor = -1;
    $('suggest').innerHTML = hits.length
      ? hits.map((h, i) =>
          '<div class="sg" data-i="' + i + '"><b>' + esc(h.name) + '</b>' +
          '<i>' + (repos.length > 1
            ? '<span style="color:' + repoColor(h.repo) + '">' + esc(h.repoName) + '</span> · ' : '') +
          esc(h.kind) + ' · ' + esc(shortPath(h.file)) + ':' + h.line + '</i></div>').join('')
      : '<div class="sg"><i>No symbol matches that.</i></div>';
    $('suggest').classList.add('on');
  }, 110);
});

$('suggest').addEventListener('click', (e) => {
  const el = e.target.closest('.sg');
  if (!el || el.dataset.i === undefined) return;
  pick(Number(el.dataset.i));
});

function pick(i) {
  const h = hits[i];
  if (!h) return;
  $('suggest').classList.remove('on');
  $('q').value = h.name;
  focusSymbol(h.id, { reset: true }).catch(() => {});
}

$('q').addEventListener('keydown', (e) => {
  if (!hits.length) return;
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    cursor = Math.max(0, Math.min(hits.length - 1, cursor + (e.key === 'ArrowDown' ? 1 : -1)));
    for (const el of document.querySelectorAll('.sg')) {
      el.setAttribute('aria-selected', Number(el.dataset.i) === cursor);
    }
  }
  if (e.key === 'Enter') { e.preventDefault(); pick(cursor === -1 ? 0 : cursor); }
  if (e.key === 'Escape') $('suggest').classList.remove('on');
});

document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
});

// ---- filter chips -----------------------------------------------------------
function renderFilters() {
  $('filters').innerHTML = KINDS.map(([key, label, kinds]) =>
    '<span class="chip" data-k="' + key + '" aria-pressed="' + enabled.has(key) + '">' +
    '<span class="dot" style="background:' + css(COLORS[kinds[0]]) + '"></span>' +
    esc(label) + '</span>').join('');
}
renderFilters();

$('filters').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  const key = chip.dataset.k;
  if (enabled.has(key)) enabled.delete(key); else enabled.add(key);
  chip.setAttribute('aria-pressed', enabled.has(key));
  applyFilters();
  kick(0.4);
});

function renderRepos() {
  const el = $('repos');
  // One repository needs no picker -- there is nothing to pick between.
  el.style.display = repos.length < 2 ? 'none' : '';
  if (repos.length < 2) return;

  el.innerHTML =
    '<option value="all">All repos (' + repos.length + ')</option>' +
    repos.map((r) => '<option value="' + r.id + '">' +
      esc(r.name) + ' — ' + r.symbols.toLocaleString() + ' symbols' + '</option>').join('');

  // Rebuilding the options drops the selection, and the canvas can change the
  // scope too (clicking a repository hub), so the value is set from the state.
  el.value = activeRepo === null ? 'all' : String(activeRepo);
  el.dataset.scoped = activeRepo !== null;
  el.style.color = activeRepo === null ? '' : repoColor(activeRepo);
}

$('repos').addEventListener('change', (e) => {
  activeRepo = e.target.value === 'all' ? null : Number(e.target.value);
  renderRepos();
  // Scoping changes what a search means, so the canvas starts fresh.
  const q = $('q').value.trim();
  if (q) {
    nodes = []; edges = []; byId = new Map(); selected = null;
    applyFilters();
    $('panel').classList.remove('on');
    $('q').dispatchEvent(new Event('input'));
  } else {
    loadLanding().catch(() => {});
  }
});

$('theme').innerHTML = Object.entries(THEMES)
  .map(([key, t]) => '<option value="' + key + '">' + esc(t.label) + '</option>')
  .join('');

let savedTheme = 'solarized-dark';
try { savedTheme = localStorage.getItem('provenlens.theme') || savedTheme; } catch { /* ignore */ }
$('theme').value = THEMES[savedTheme] ? savedTheme : 'solarized-dark';
applyTheme($('theme').value);
$('theme').addEventListener('change', (e) => applyTheme(e.target.value));

// Dragging the panel edge: reading source is what the panel is for, so how
// much room it gets should be the reader's call.
(() => {
  const grip = $('grip');
  let from = null;
  const width = () => parseInt(getComputedStyle(document.documentElement).getPropertyValue('--panel-w'), 10);

  grip.addEventListener('mousedown', (e) => {
    from = { x: e.clientX, w: width() };
    grip.classList.add('dragging');
    e.preventDefault();
  });
  window.addEventListener('mousemove', (e) => {
    if (!from) return;
    const next = Math.max(320, Math.min(window.innerWidth - 260, from.w + (from.x - e.clientX)));
    document.documentElement.style.setProperty('--panel-w', next + 'px');
  });
  window.addEventListener('mouseup', () => {
    if (!from) return;
    from = null;
    grip.classList.remove('dragging');
    // A width chosen once should not have to be chosen again on reload.
    try { localStorage.setItem('provenlens.panelWidth', String(width())); } catch { /* ignore */ }
  });

  try {
    const saved = Number(localStorage.getItem('provenlens.panelWidth'));
    if (saved >= 320) document.documentElement.style.setProperty('--panel-w', saved + 'px');
  } catch { /* ignore */ }
})();

api('/api/overview').then((o) => {
  repos = o.repos;
  $('root').textContent = repos.length === 1
    ? repos[0].name
    : repos.length + ' repos';
  $('stats').textContent = o.symbols.toLocaleString() + ' symbols · ' + o.resolution + '% resolved';
  renderRepos();
  return loadLanding();
}).catch(() => {});

applyFilters();
$('q').focus();
step();
</script>
</body>
</html>
