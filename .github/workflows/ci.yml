name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: this workflow verifies, it never writes to the repository.
permissions:
  contents: read

jobs:
  test:
    name: yarn test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the floor (node:sqlite); 24 is what development runs on.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # --frozen-lockfile: the four pins in yarn.lock are the supply-chain boundary. A resolution
      # that differs from the lockfile is a failure, not something to quietly accept.
      - name: Install (frozen lockfile)
        run: yarn install --frozen-lockfile
      - name: Audit
        run: yarn audit
      - name: Test
        run: yarn test
      # The index must be buildable on a clean checkout, and this repository deliberately carries
      # the .gitignore negation that once crashed it -- so indexing itself is a regression test.
      - name: Index this repository
        run: node bin/codelens.js init . && node bin/codelens.js status
