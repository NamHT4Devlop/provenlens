# What `yarn audit` and dependency review cannot do: raise the version.
# Those two say a pin has become dangerous; this opens the pull request that
# fixes it, and the checks on that PR decide whether the new version is usable.
version: 2

updates:
  # The four runtime dependencies. There are no dev dependencies, and the
  # Security workflow fails if that changes.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    # Two groups, not one. The first Dependabot run proved why: it put
    # `ignore` 7.0.6 -> 7.0.8, which is fine, in the same pull request as
    # web-tree-sitter 0.25 -> 0.27, which collapses the entire suite. A safe
    # update should not wait behind an impossible one.
    groups:
      # web-tree-sitter and tree-sitter-wasms share an ABI and move together or
      # not at all: 0.27 does not load the 0.1.x grammars. Still opened rather
      # than pinned shut, because the tests and the resolution gate are what
      # should decide it -- and on the first attempt they did, on all three
      # runners. Grouped so the two are always tried as a pair.
      tree-sitter:
        patterns: ['web-tree-sitter', 'tree-sitter-wasms']
      dependencies:
        patterns: ['*']
        exclude-patterns: ['web-tree-sitter', 'tree-sitter-wasms']
    commit-message:
      prefix: 'deps'
    labels: ['dependencies']

  # A compromised action runs with this repository's token. Tags move, so
  # keeping them current is the cheap half of that problem; pinning each action
  # to a commit SHA is the thorough half, and is a decision to take separately.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Ho_Chi_Minh
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    labels: ['dependencies', 'github-actions']
